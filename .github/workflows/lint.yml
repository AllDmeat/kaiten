name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Lint
        run: swift format lint --strict --recursive Sources/ Tests/

  response-mapping:
    name: ResponseMapping.swift matches its generator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate
        run: swift scripts/generate-response-mapping.swift

      - name: Fail on drift
        run: git diff --exit-code Sources/KaitenSDK/ResponseMapping.swift
