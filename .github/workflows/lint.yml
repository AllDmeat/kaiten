name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4.2.3

      - name: Lint
        run: swift format lint --strict --recursive Sources/ Tests/
