          type: integer
        description: Card ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentEncoding: binary
                  description: File content
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                # NOTE: the docs describe a single flat object, but its `type` enum includes
                # 11 (private file), and type-11 files carry a structurally different shape
                # (UUID string `id`) — see the comment above CardFileEntry. The response is
                # therefore modelled with the same anyOf used for Card.files.
                $ref: '#/components/schemas/CardFileEntry'
        '400':
          description: Upload file error
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
        '503':
          description: Service unavailable
