        hidden_on_public_site:
          type: boolean
          description: Document is hidden on public site
        settings:
          $ref: '#/components/schemas/DocumentSettings'
          description: 'Document appearance settings. Server-side shallow merge: only the keys sent are changed, other existing settings are preserved'
        backup_version:
          type: number
          description: Document version to restore
        published_version:
          anyOf:
