        schema:
          type: string
        description: Filter by audit log event ID
      - name: limit
        in: query
        schema:
          type: integer
        description: 'Maximum number of audit log events to return. Default: 100, max: 500. The API applies 500 when the limit is greater, and the default when it is 0'
