      - name: checklist_id
        in: path
        required: true
        schema:
          type: integer
        description: Checklist ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Checklist item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Remove checklist item
      operationId: remove_checklist_item
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      - name: checklist_id
        in: path
        required: true
        schema:
          type: integer
        description: Checklist ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Checklist item ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedChecklistItemResponse'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
  /cards/{card_id}/tags:
    get:
      summary: List card tags
