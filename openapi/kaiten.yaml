  /documents:
    get:
      summary: Retrieve list of documents
      operationId: list_documents
      parameters:
      - name: query
        in: query
        schema:
          type: string
        description: Search query string
      - name: offset
        in: query
        schema:
          type: integer
        description: 'Number of records to skip for pagination. Default: 0'
      - name: limit
        in: query
        schema:
          type: integer
        description: 'Maximum number of records to return. Default: 100'
      - name: version
        in: query
        schema:
          type: integer
        description: 'Search version. Default: 1. Use version=2 to search via OpenSearch and enable the new response format with result and position fields'
      - name: condition
        in: query
        schema:
          type: integer
        description: Filter condition. Used with version=2
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated list of fields to search in. Used with version=2
      - name: start_position
        in: query
        schema:
          type: string
        description: Search cursor for version=2 pagination. Pass the position value from the previous version=2 response
      - name: include_search_preview
        in: query
        schema:
          type: boolean
        description: 'Include the preview object in each search result. Used with version=2. Default: false'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                description: Array of documents when version is omitted or 1, an object with result and position when version=2
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/DocumentListItem'
                - $ref: '#/components/schemas/DocumentSearchResponse'
        '401':
          description: Invalid token
    post:
      summary: Create new document
      operationId: create_document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error
        '401':
          description: Invalid token
        '402':
          description: Feature is not supported by tariff
        '403':
          description: Forbidden
        '409':
          description: Conflict — the key is already in use in the company
  /documents/{document_uid}:
    get:
      summary: Retrieve document
      operationId: get_document
      parameters:
      - name: document_uid
        in: path
        required: true
        schema:
          type: string
        description: Document UID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update document
      operationId: update_document
      parameters:
      - name: document_uid
        in: path
        required: true
        schema:
          type: string
        description: Document UID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error
        '401':
          description: Invalid token
        '402':
          description: Feature is not supported by tariff
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict — key already in use or has unfinished key operations
    delete:
      summary: Remove document
      operationId: delete_document
      parameters:
      - name: document_uid
        in: path
        required: true
        schema:
          type: string
        description: Document UID
      responses:
        # NOTE: the remove-document response table documents only uid, id, title and archived, but
        # the 200 example on the same page shows the full document object, so the shared Document
        # schema (all properties optional) covers both shapes.
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Document has child tree entities — remove or move them first
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
