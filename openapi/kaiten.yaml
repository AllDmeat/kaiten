openapi: 3.1.0
info:
  title: Kaiten API
  description: Kaiten project management API. Extracted from developers.kaiten.ru.
  version: 1.0.0
servers:
- url: https://{company}.kaiten.ru/api/latest
  variables:
    company:
      default: your-company
      description: Your Kaiten company subdomain
security:
- bearerAuth: []
paths:
  /boards/{board_id}/columns:
    post:
      summary: Create new column
      operationId: create_column
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: integer
        description: Board ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          description: Bad request
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
    get:
      summary: Get list of columns
      operationId: get_list_of_columns
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: integer
        description: Board ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Column'
        '401':
          description: Invalid token
        '403':
          description: Forbiden
        '404':
          description: Not found
  /boards/{board_id}/lanes:
    post:
      summary: Create new lane
      operationId: create_lane
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: integer
        description: Board ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaneRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lane'
        '400':
          description: Bad request
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
    get:
      summary: Get list of lanes
      operationId: get_list_of_lanes
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: integer
        description: Board ID
      - name: condition
        in: query
        schema:
          type: integer
        description: "Lane condition filter: 1 = live, 2 = archived, 3 = deleted"
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lane'
        '401':
          description: Invalid token
        '403':
          description: Forbiden
        '404':
          description: Not found
  /boards/{id}:
    get:
      summary: Get board
      operationId: get_board
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Board ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          description: Invalid token
        '403':
          description: Forbiden
        '404':
          description: Not found
  /cards:
    get:
      summary: Get list of cards
      operationId: get_cards
      parameters:
      - name: board_id
        in: query
        schema:
          type: integer
        description: Filter by board ID
      - name: column_id
        in: query
        schema:
          type: integer
        description: Filter by column ID
      - name: lane_id
        in: query
        schema:
          type: integer
        description: Filter by lane ID
      - name: offset
        in: query
        schema:
          type: integer
        description: Offset for pagination
      - name: limit
        in: query
        schema:
          type: integer
        description: Limit for pagination
      # Date filters
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards created before this date
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards created after this date
      - name: updated_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards updated before this date
      - name: updated_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards updated after this date
      - name: first_moved_in_progress_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards first moved to in-progress after this date
      - name: first_moved_in_progress_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards first moved to in-progress before this date
      - name: last_moved_to_done_at_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards last moved to done after this date
      - name: last_moved_to_done_at_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards last moved to done before this date
      - name: due_date_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards with due date after this date
      - name: due_date_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter cards with due date before this date
      # Text search
      - name: query
        in: query
        schema:
          type: string
        description: Text search query
      - name: search_fields
        in: query
        schema:
          type: string
        description: Comma-separated fields to search in
      # Tags
      - name: tag
        in: query
        schema:
          type: string
        description: Filter by tag name
      - name: tag_ids
        in: query
        schema:
          type: string
        description: Comma-separated tag IDs
      # ID filters
      - name: type_id
        in: query
        schema:
          type: integer
        description: Filter by card type ID
      - name: type_ids
        in: query
        schema:
          type: string
        description: Comma-separated card type IDs
      - name: member_ids
        in: query
        schema:
          type: string
        description: Comma-separated member user IDs
      - name: owner_id
        in: query
        schema:
          type: integer
        description: Filter by owner user ID
      - name: owner_ids
        in: query
        schema:
          type: string
        description: Comma-separated owner user IDs
      - name: responsible_id
        in: query
        schema:
          type: integer
        description: Filter by responsible user ID
      - name: responsible_ids
        in: query
        schema:
          type: string
        description: Comma-separated responsible user IDs
      - name: column_ids
        in: query
        schema:
          type: string
        description: Comma-separated column IDs
      - name: space_id
        in: query
        schema:
          type: integer
        description: Filter by space ID
      - name: external_id
        in: query
        schema:
          type: string
        description: Filter by external ID
      - name: organizations_ids
        in: query
        schema:
          type: string
        description: Comma-separated organization IDs
      # Exclude filters
      - name: exclude_board_ids
        in: query
        schema:
          type: string
        description: Comma-separated board IDs to exclude
      - name: exclude_lane_ids
        in: query
        schema:
          type: string
        description: Comma-separated lane IDs to exclude
      - name: exclude_column_ids
        in: query
        schema:
          type: string
        description: Comma-separated column IDs to exclude
      - name: exclude_owner_ids
        in: query
        schema:
          type: string
        description: Comma-separated owner IDs to exclude
      - name: exclude_card_ids
        in: query
        schema:
          type: string
        description: Comma-separated card IDs to exclude
      # State filters
      - name: condition
        in: query
        schema:
          type: integer
        description: "Card condition: 1 = on board, 2 = archived"
      - name: states
        in: query
        schema:
          type: string
        description: "Comma-separated states: 1 = queued, 2 = in progress, 3 = done"
      - name: archived
        in: query
        schema:
          type: boolean
        description: Filter by archived status
      - name: asap
        in: query
        schema:
          type: boolean
        description: Filter ASAP cards
      - name: overdue
        in: query
        schema:
          type: boolean
        description: Filter overdue cards
      - name: done_on_time
        in: query
        schema:
          type: boolean
        description: Filter cards done on time
      - name: with_due_date
        in: query
        schema:
          type: boolean
        description: Filter cards that have a due date
      - name: is_request
        in: query
        schema:
          type: boolean
        description: Filter service desk request cards
      # Sorting
      - name: order_by
        in: query
        schema:
          type: string
        description: Field to order by
      - name: order_direction
        in: query
        schema:
          type: string
        description: "Order direction: asc or desc"
      - name: order_space_id
        in: query
        schema:
          type: integer
        description: Space ID for ordering context
      # Extra
      - name: additional_card_fields
        in: query
        schema:
          type: string
        description: Comma-separated additional fields to include
      responses:
        '200':
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
    post:
      summary: Create new card
      operationId: create_card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '200':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    patch:
      summary: Batch update for cards
      operationId: batch_update_cards
      description: >
        Updates multiple cards selected by criteria. Runs in the background and
        returns a job ID. The documentation requires at least one criteria field
        together with `attributes`, or `column_id` + `lane_id` together with
        `order_by`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateCardsRequest'
      responses:
        '202':
          description: Batch update accepted, runs in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdateCardsResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid token
        '402':
          description: Feature is not supported by tariff
        '403':
          description: Forbidden
        '404':
          description: Not found
  /cards/{card_id}:
    patch:
      summary: Update card
      operationId: update_card
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: Card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Card not found
    get:
      summary: Get card
      operationId: get_card
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      responses:
        '200':
          description: Card details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
        '404':
          description: Card not found
    delete:
      summary: Delete card
      operationId: delete_card
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      responses:
        '200':
          description: Card deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Card not found
  /cards/{card_id}/members:
    get:
      summary: Retrieve list of card members
      operationId: retrieve_list_of_card_members
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberDetailed'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
    post:
      summary: Add member to card
      operationId: add_card_member
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardMemberRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailed'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
  /cards/{card_id}/members/{id}:
    patch:
      summary: Update card member role
      operationId: update_card_member_role
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardMemberRoleRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardMemberRole'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Remove member from card
      operationId: remove_card_member
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: User ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedMemberResponse'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
  /cards/{card_id}/allowed-users:
    get:
      summary: Retrieve users list
      operationId: retrieve_card_allowed_users
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
        description: Card ID
      - name: type
        in: query
        schema:
          type: string
        description: 'Type of users to return. Documented values: sd-owners (company users with access to service-desk), virtual-users (company virtual users), mention'
      # DOC_MISMATCH: docs=filter by full_name, email or username, actual has no observed effect (full list returned regardless) — https://developers.kaiten.ru/card-allowed-users/retrieve-users-list
      - name: search
        in: query
        schema:
          type: string
        description: Filter by full_name, email or username
      # DOC_MISMATCH: docs=the field to sort by (default id), actual has no observed effect (response order unchanged and not sorted by id) — https://developers.kaiten.ru/card-allowed-users/retrieve-users-list
      - name: orderBy
        in: query
        schema:
          type: string
        description: The field to sort by
      - name: role
        in: query
        schema:
          type: integer
        description: Filter by role
      # DOC_MISMATCH: docs=maximum amount of users in response, actual has no observed effect (full list returned regardless) — https://developers.kaiten.ru/card-allowed-users/retrieve-users-list
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum amount of users in response
      # DOC_MISMATCH: docs=number of records to skip, actual has no observed effect (full list returned regardless) — https://developers.kaiten.ru/card-allowed-users/retrieve-users-list
      - name: offset
        in: query
        schema:
          type: integer
        description: Number of records to skip
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllowedUser'
        '401':
          description: Invalid token
        '403':
          description: Forbidden
        '404':
          description: Not found
